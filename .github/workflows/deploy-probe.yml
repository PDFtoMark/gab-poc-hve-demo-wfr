# Minimal replica of the hve-core deploy-docs.yml hand-off: it validates that
# source-run-id names a successful default-branch "Demo Material Render" run,
# then stages the demo-material-site artifact from that run (i.e. attacker
# content reaches the deployment stage).
name: Deploy Probe

on:
  workflow_dispatch:
    inputs:
      source-run-id:
        description: 'Publisher or render run that requested this deploy'
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate the source run
        uses: actions/github-script@v7
        env:
          SOURCE_RUN_ID: ${{ inputs.source-run-id }}
        with:
          script: |
            const { data: repository } = await github.rest.repos.get({ ...context.repo });
            const runId = Number(process.env.SOURCE_RUN_ID);
            if (!Number.isSafeInteger(runId) || runId <= 0) throw new Error("source-run-id must be a positive safe integer");
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: runId });
            console.log(JSON.stringify({ path: run.path, head_branch: run.head_branch, conclusion: run.conclusion, default_branch: repository.default_branch }));
            if (run.conclusion !== "success") throw new Error("source run was not successful");
            if (run.head_branch !== repository.default_branch) throw new Error("source run was not on the default branch");
            if (run.path !== ".github/workflows/demo-material-render.yml") throw new Error("source run is not Demo Material Render");
            console.log("DEPLOY_ACCEPTED_SOURCE_RUN=" + runId);

      - name: Stage the published bundle
        uses: actions/download-artifact@v4
        with:
          name: demo-material-site-${{ inputs.source-run-id }}
          run-id: ${{ inputs.source-run-id }}
          github-token: ${{ github.token }}
          path: demo-material-bundle

      - name: Show staged attacker content
        run: |
          set -euo pipefail
          find demo-material-bundle -type f -print
          echo "--- index.json ---"
          cat demo-material-bundle/index.json
          echo "--- L100/index.html ---"
          cat demo-material-bundle/L100/index.html
